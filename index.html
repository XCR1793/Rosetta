<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Perch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="title-bar">
      <span class="title-label" id="titleLabel"></span>
      <div class="title-bar-left">
        <button class="title-btn settings-btn" id="settingsBtn" title="Settings" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path fill="currentColor" d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97 0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1 0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66z"/>
          </svg>
        </button>
      </div>
      <div class="title-bar-drag"></div>
      <div class="title-bar-right">
        <!-- Glyphs match Firefox: Segoe Fluent Icons / Segoe MDL2 Assets -->
        <button class="title-btn caption-btn" id="minimizeBtn" title="Minimize" type="button" aria-label="Minimize">
          <span class="caption-icon" aria-hidden="true">&#xE921;</span>
        </button>
        <button class="title-btn caption-btn" id="maximizeBtn" title="Maximize" type="button" aria-label="Maximize">
          <span class="caption-icon" id="maximizeIcon" aria-hidden="true">&#xE922;</span>
        </button>
        <button class="title-btn caption-btn close-btn" id="closeBtn" title="Close" type="button" aria-label="Close">
          <span class="caption-icon" aria-hidden="true">&#xE8BB;</span>
        </button>
      </div>
    </header>

    <main class="content">
      <section class="view view-home" id="homeView"></section>
      <section class="view view-settings" id="settingsView" hidden></section>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
